<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title><!-- TITLE --></title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f8fafc;
      --panel: #ffffff;
      --text: #0f172a;
      --muted: #475569;
      --line: #64748b;
      --blue-bg: #dbeafe;
      --blue-line: #2563eb;
      --green-bg: #dcfce7;
      --green-line: #16a34a;
      --amber-bg: #fef3c7;
      --amber-line: #d97706;
      --purple-bg: #ede9fe;
      --purple-line: #7c3aed;
      --red-bg: #fee2e2;
      --red-line: #dc2626;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #020617;
        --panel: #0f172a;
        --text: #e2e8f0;
        --muted: #94a3b8;
        --line: #94a3b8;
        --blue-bg: #172554;
        --blue-line: #93c5fd;
        --green-bg: #052e16;
        --green-line: #86efac;
        --amber-bg: #451a03;
        --amber-line: #fcd34d;
        --purple-bg: #2e1065;
        --purple-line: #c4b5fd;
        --red-bg: #450a0a;
        --red-line: #fca5a5;
      }
    }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.45;
    }
    main {
      max-width: 960px;
      margin: 32px auto;
      padding: 0 20px;
    }
    .card {
      background: var(--panel);
      border: 1px solid color-mix(in srgb, var(--muted) 24%, transparent);
      border-radius: 18px;
      padding: 24px;
    }
    h1 { margin: 0 0 6px; font-size: 24px; }
    .subtitle { margin: 0 0 22px; color: var(--muted); }
    svg { width: 100%; height: auto; display: block; }
    .node rect, .node path, .node circle, .node ellipse, .node polygon {
      stroke-width: 1.2;
    }
    .blue rect, .blue path, .blue circle, .blue ellipse, .blue polygon { fill: var(--blue-bg); stroke: var(--blue-line); }
    .green rect, .green path, .green circle, .green ellipse, .green polygon { fill: var(--green-bg); stroke: var(--green-line); }
    .amber rect, .amber path, .amber circle, .amber ellipse, .amber polygon { fill: var(--amber-bg); stroke: var(--amber-line); }
    .purple rect, .purple path, .purple circle, .purple ellipse, .purple polygon { fill: var(--purple-bg); stroke: var(--purple-line); }
    .red rect, .red path, .red circle, .red ellipse, .red polygon { fill: var(--red-bg); stroke: var(--red-line); }
    .label { fill: var(--text); font-size: 14px; font-weight: 600; }
    .small { fill: var(--muted); font-size: 12px; font-weight: 400; }
    .line { stroke: var(--line); stroke-width: 1.4; fill: none; }
    .notes { margin-top: 20px; color: var(--muted); font-size: 14px; }
    code { color: var(--text); }
  </style>
</head>
<body>
  <main>
    <section class="card">
      <h1><!-- TITLE --></h1>
      <p class="subtitle"><!-- SUBTITLE --></p>

      <!-- SVG -->

      <section class="notes">
        <!-- NOTES -->
      </section>
    </section>
  </main>
</body>
</html>
